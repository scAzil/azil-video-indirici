name: Build Windows x64 (candidate)

on:
  push:
    branches: [build/windows-v1-release-prep]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Extract original v1 source
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath "AZiL_Video_Indirici_v1.zip" -DestinationPath "_source" -Force
          Get-ChildItem "_source" -Recurse -File | Select-Object FullName
          $apps = @(Get-ChildItem "_source" -Recurse -File -Filter "app.py")
          if ($apps.Count -ne 1) { throw "Expected exactly one original app.py; found $($apps.Count)" }
          "APP_PATH=$($apps[0].FullName)" >> $env:GITHUB_ENV
          "APP_DIR=$($apps[0].DirectoryName)" >> $env:GITHUB_ENV
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller yt-dlp requests pillow imageio-ffmpeg
          if (Test-Path (Join-Path $env:APP_DIR "requirements.txt")) {
            python -m pip install -r (Join-Path $env:APP_DIR "requirements.txt")
          }
      - name: Check source compiles
        shell: pwsh
        run: |
          python -m py_compile "$env:APP_PATH"
      - name: Bundle FFmpeg and build GUI EXE
        shell: pwsh
        run: |
          $ff = python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())"
          if (-not (Test-Path $ff)) { throw "FFmpeg executable missing" }
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name "AZiL_Video_Indirici" --collect-all yt_dlp --add-binary "$($ff);." --distpath "dist" --workpath "build" --specpath "build" "$env:APP_PATH"
          if (-not (Test-Path "dist/AZiL_Video_Indirici.exe")) { throw "EXE not produced" }
      - name: Create portable ZIP and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "portable" | Out-Null
          Copy-Item "dist/AZiL_Video_Indirici.exe" "portable/"
          @'
          AZiL Video Indirici v1.0.0 Windows x64 BUILD CANDIDATE
          Run AZiL_Video_Indirici.exe.
          Windows security warnings must be evaluated before allowing the app.
          Only download media you have permission to download.
          This artifact is not yet a tested official release.
          '@ | Set-Content "portable/README.txt" -Encoding UTF8
          Compress-Archive -Path "portable/*" -DestinationPath "AZiL_Video_Indirici_v1.0.0_Windows_x64.zip" -Force
          Get-FileHash "dist/AZiL_Video_Indirici.exe", "AZiL_Video_Indirici_v1.0.0_Windows_x64.zip" -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $(Split-Path $_.Path -Leaf)" } | Set-Content SHA256SUMS.txt
      - name: Upload candidate binaries for review
        uses: actions/upload-artifact@v4
        with:
          name: AZiL-Video-Indirici-Windows-x64-candidate
          path: |
            dist/AZiL_Video_Indirici.exe
            AZiL_Video_Indirici_v1.0.0_Windows_x64.zip
            SHA256SUMS.txt
          if-no-files-found: error
