name: Unpack original source for repair

on:
  push:
    branches: [build/windows-v1-release-prep]
    paths: ['.github/workflows/unpack-source.yml']

permissions:
  contents: write

jobs:
  unpack-original:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Unpack original source ZIP into reviewable files
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath "AZiL_Video_Indirici_v1.zip" -DestinationPath "_extract" -Force
          $app = @(Get-ChildItem "_extract" -Recurse -File -Filter "app.py")
          if ($app.Count -ne 1) { throw "Expected original app.py" }
          $origin = $app[0].DirectoryName
          New-Item -ItemType Directory -Force "source-v1" | Out-Null
          Get-ChildItem -LiteralPath $origin -File | ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination "source-v1" -Force
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source-v1
          if (-not (git diff --cached --quiet)) {
            git commit -m "chore: expose original v1 source for Windows repair"
            git push
          }
